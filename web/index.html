<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  
  <!-- Primary Meta Tags -->
  <title>Atteni | Smart School Transportation & Attendance Management</title>
  <meta name="title" content="Atteni | Smart School Transportation & Attendance Management">
  <meta name="description" content="Atteni is an advanced school bus tracking and student attendance management system. Ensure student safety, optimize transport routes, and keep parents updated in real-time.">
  <meta name="keywords" content="Atteni, school bus tracking, student attendance app, school transportation management, live bus tracking, fleet management, school security">
  <meta name="author" content="Atteni">
  <meta name="theme-color" content="#1D4ED8">

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://atteni.online/">
  <meta property="og:title" content="Atteni | Smart School Transportation & Attendance Management">
  <meta property="og:description" content="Advanced school bus tracking and student attendance system. Ensure student safety and keep parents updated in real-time.">
  <meta property="og:image" content="icons/Icon-512.png">

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image">
  <meta property="twitter:url" content="https://atteni.online/">
  <meta property="twitter:title" content="Atteni | Smart School Transportation & Attendance Management">
  <meta property="twitter:description" content="Advanced school bus tracking and student attendance system. Ensure student safety and keep parents updated in real-time.">
  <meta property="twitter:image" content="icons/Icon-512.png">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Atteni">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
